<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="4" y1="8" x2="28" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#1e293b" stroke-width="1" />

  <!-- Topology node dots -->
  <circle cx="7" cy="7" r="1.25" fill="#38bdf8" fill-opacity="0.4" />
  <circle cx="25" cy="7" r="1.25" fill="#38bdf8" fill-opacity="0.4" />
  <circle cx="25" cy="25" r="1.25" fill="#38bdf8" fill-opacity="0.4" />

  <!-- Activity pulse line -->
  <path
    d="M4 16h4.5l3-7.5 4 15 4-11 2.5 3.5H28"
    stroke="url(#glow)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Peak node indicators -->
  <circle cx="11.5" cy="8.5" r="1.5" fill="#7dd3fc" />
  <circle cx="15.5" cy="23.5" r="1.5" fill="#38bdf8" />
  <circle cx="19.5" cy="12.5" r="1.5" fill="#7dd3fc" />
</svg>
